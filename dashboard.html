<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard - HumanVerification</title>

  <link rel="stylesheet" href="style.css">

</head>
<script src="verify.js"></script>
<body>

<nav>

  <b>HumanVerification</b>

  <div>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="docs.html">Docs</a>
  </div>

</nav>

<section class="hero">

  <h1 style="font-size:42px">
    Create verification
  </h1>

  <p>
    Enter your website and Discord webhook.
  </p>

  <br>

  <input
    id="website"
    type="text"
    placeholder="https://example.com"
  >

  <br><br>

  <input
    id="webhook"
    type="password"
    placeholder="Discord webhook URL"
  >

  <br><br>

  <button
    class="button"
    id="generate"
  >
    Generate
  </button>

  <div id="result" style="display:none">

    <h3 style="margin-top:40px">
      Your Site Key
    </h3>

    <pre id="siteKey"></pre>

    <h3>
      Add this to your website
    </h3>

    <pre id="integration"></pre>

  </div>

</section>

<script>

const API =
  "https://YOUR-BACKEND-DOMAIN.com";

document
  .getElementById("generate")
  .addEventListener("click", async () => {

    const website =
      document
        .getElementById("website")
        .value
        .trim();

    const webhook =
      document
        .getElementById("webhook")
        .value
        .trim();

    if (!website) {
      alert("Enter your website.");
      return;
    }

    if (!webhook) {
      alert("Enter your Discord webhook.");
      return;
    }

    try {

      const response =
        await fetch(
          API + "/api/sites",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              website,
              webhook
            })
          }
        );

      const data =
        await response.json();

      if (!data.success) {
        alert(
          data.error ||
          "Something went wrong."
        );

        return;
      }

      document
        .getElementById("siteKey")
        .textContent =
        data.siteKey;

      document
        .getElementById("integration")
        .textContent =
`<script
  src="https://YOUR-BACKEND-DOMAIN.com/verify.js?site=${data.siteKey}">
<\/script>`;

      document
        .getElementById("result")
        .style.display = "block";

    } catch (error) {

      alert(
        "Could not connect to the verification server."
      );

      console.error(error);

    }

  });

</script>

</body>
</html>
