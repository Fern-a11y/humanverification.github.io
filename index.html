<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        /* Modern Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0B0F19;
            color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow in Background */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 30%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 550px;
            padding: 40px;
            z-index: 10;
            position: relative;
        }

        /* Beautiful Neon Gradient Typography */
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #9CA3AF;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Glassmorphism Navigation Button */
        .btn {
            display: inline-block;
            background: #6366F1;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: #4F46E5;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
        }

        /* Subtle Floating Animation */
        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.3)); }
            100% { filter: drop-shadow(0 0 30px rgba(236, 72, 153, 0.5)); }
        }

        /* Dynamic Mouse Trail Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas"></canvas>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in the Deep Web?</h1>
        <p>The page you are looking for doesn't exist, has been completely vaporized, or moved to another dimension.</p>
    </div>

    <script>
        // Minimal interactive particle script for a "nice" UX touch
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: e.clientX,
                    y: e.clientY,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    color: `hsl(${Math.random() * 40 + 260}, 80%, 70%)`,
                    alpha: 1
                });
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.015;
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
